name: "🧩 Task"
description: "A concrete piece of work, usually part of a feature or epic."
title: "[Task] "
labels: ["task"]
projects: ["beyondCode-in/34"]
body:
  - type: input
    id: parent
    attributes:
      label: "Parent issue"
      placeholder: "#42"

  - type: textarea
    id: description
    attributes:
      label: "What needs doing?"
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: "Done when"
      value: |
        - [ ]
        - [ ]

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "🔴 P0 — Critical: something important is stopped"
        - "🟠 P1 — High: needed this sprint"
        - "🟡 P2 — Medium: in the next few weeks"
        - "🟢 P3 — Low: whenever there's time"
      default: 2
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: "Size estimate"
      options:
        - "XS — a few hours"
        - "S — about a day"
        - "M — 2 to 3 days"
        - "L — about a week"
        - "XL — more than a week (should be split)"
        - "❔ Not sure yet"
      default: 1

  - type: dropdown
    id: areas
    attributes:
      label: "Areas affected"
      multiple: true
      options:
        - "🌐 Web app"
        - "📱 Mobile app"
        - "⚙️ API / backend"
        - "🗄️ Database / data"
        - "🎨 Design system / UI"
        - "🏗️ Infrastructure / DevOps"
        - "📄 Docs"
        - "🧪 Tests"
    validations:
      required: true

  - type: dropdown
    id: discipline
    attributes:
      label: "Kind of work"
      multiple: true
      options:
        - "Frontend"
        - "Backend"
        - "Design"
        - "QA"
        - "DevOps"
        - "Content"
