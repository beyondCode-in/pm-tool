name: "✨ Feature / user story"
description: "Something new to build, written as a user story with acceptance criteria."
title: "[Feature] "
labels: ["feature", "triage"]
projects: ["beyondCode-in/34"]
body:
  - type: input
    id: story
    attributes:
      label: "User story"
      description: "As a … I want … so that …"
      placeholder: "As a sales manager, I want to export the monthly report as CSV so that I can share it with finance"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What's painful or impossible today?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "What should it do? Mock-ups and screenshots welcome."

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "How will we know it's done? One per line."
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "🔴 P0 — Critical: something important is stopped"
        - "🟠 P1 — High: needed this sprint"
        - "🟡 P2 — Medium: in the next few weeks"
        - "🟢 P3 — Low: whenever there's time"
      default: 2
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: "Areas affected"
      multiple: true
      options:
        - "🌐 Web app"
        - "📱 Mobile app"
        - "⚙️ API / backend"
        - "🗄️ Database / data"
        - "🔐 Login & accounts"
        - "💳 Billing & payments"
        - "📊 Reports & analytics"
        - "📧 Emails & notifications"
        - "🎨 Design system / UI"
        - "🏗️ Infrastructure / DevOps"
        - "📄 Docs"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: "Size estimate"
      description: "Your best guess. The team will refine it during planning."
      options:
        - "XS — a few hours"
        - "S — about a day"
        - "M — 2 to 3 days"
        - "L — about a week"
        - "XL — more than a week (should be split)"
        - "❔ Not sure yet"
      default: 5

  - type: dropdown
    id: timeframe
    attributes:
      label: "Target timeframe"
      options:
        - "This sprint"
        - "Next sprint"
        - "This quarter"
        - "Later / backlog"
      default: 3

  - type: input
    id: epic
    attributes:
      label: "Parent epic (optional)"
      placeholder: "#42"

  - type: checkboxes
    id: ready
    attributes:
      label: "Ready for planning?"
      description: "Tick what's already true. Unticked items are fine; they tell the team what's missing."
      options:
        - label: "Design or mock-ups are attached or not needed"
        - label: "Dependencies are known and linked"
        - label: "Analytics or tracking needs are described"
