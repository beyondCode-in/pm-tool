name: Bug Report
description: Create a report for a defect or unintended software behavior
title: "[BUG]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: textarea
    id: bug_summary
    attributes:
      label: Bug Summary & Reproduction Steps
      description: Describe what happened and step-by-step instructions to reproduce.
      placeholder: "1. Go to...\n2. Click on...\n3. Observe error..."
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected vs Actual Behavior
      placeholder: "Expected X, but actual behavior was Y."
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Bug Severity
      options:
        - Critical (Production Down)
        - High (Feature Blocked)
        - Medium (Workaround Available)
        - Low (Cosmetic)
    validations:
      required: true
  - type: input
    id: affected_version
    attributes:
      label: Affected Software Version
      placeholder: "v2.3.4"
    validations:
      required: false
