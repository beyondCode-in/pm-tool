name: "🔬 Technical Spike / Research"
description: "Timeboxed investigation or architectural research ticket"
title: "[SPIKE]: "
labels: ["spike", "research", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Technical Spike / Research 🔬
        Use this template for timeboxed investigations, proof-of-concept benchmarks, or design reviews.

  - type: input
    id: goal
    attributes:
      label: "Research Goal / Core Question"
      placeholder: "e.g., Evaluate Redis vs Memcached for session token cache under 50k RPS"
    validations:
      required: true

  - type: dropdown
    id: timebox
    attributes:
      label: "Timebox Limit"
      options:
        - "⏱️ 4 Hours (Quick Investigation)"
        - "⏱️ 1 Day (Standard Spike)"
        - "⏱️ 2 Days (In-depth Architectural Spike)"
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: "Key Questions to Answer"
      placeholder: |
        1. What is the P99 latency impact under max load?
        2. How does memory failover behave during node restart?
        3. What are the operational setup costs?
    validations:
      required: true

  - type: textarea
    id: expected_deliverable
    attributes:
      label: "Expected Deliverable"
      placeholder: "e.g., Architecture Decision Record (ADR) file in docs/adr/ and benchmarking script"
    validations:
      required: true
