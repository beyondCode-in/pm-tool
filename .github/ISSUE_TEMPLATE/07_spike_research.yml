name: "🔬 Spike / research"
description: "A time-boxed investigation to answer a question before building."
title: "[Spike] "
labels: ["spike"]
projects: ["beyondCode-in/34"]
body:
  - type: input
    id: question
    attributes:
      label: "The question to answer"
      placeholder: "Can we move report generation to a background job without changing the API?"
    validations:
      required: true

  - type: dropdown
    id: timebox
    attributes:
      label: "Time box"
      options:
        - "Half a day"
        - "1 day"
        - "2 days"
        - "1 week"
      default: 1
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: "Options to compare"
      value: |
        1.
        2.

  - type: dropdown
    id: deliverable
    attributes:
      label: "Deliverable"
      multiple: true
      options:
        - "Written recommendation"
        - "Architecture decision record (ADR)"
        - "Prototype / proof of concept"
        - "Follow-up issues created"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "🔴 P0 — Critical: something important is stopped"
        - "🟠 P1 — High: needed this sprint"
        - "🟡 P2 — Medium: in the next few weeks"
        - "🟢 P3 — Low: whenever there's time"
      default: 2
    validations:
      required: true
