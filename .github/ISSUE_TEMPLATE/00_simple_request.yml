name: "💡 Ask for something"
description: "Not technical? Start here. Pick a few options and describe what you need in your own words."
title: "[Request] "
labels: ["request", "triage"]
projects: ["beyondCode-in/34"]
body:
  - type: markdown
    attributes:
      value: |
        ### 👋 Hi! Tell us what you need.
        Just pick from the lists and write a sentence or two. The team will sort out the technical details.

  - type: dropdown
    id: request_type
    attributes:
      label: "What kind of request is this?"
      options:
        - "✨ A new idea or feature"
        - "🎨 Change how something looks or reads"
        - "🐛 Something is broken"
        - "🎧 A customer needs help"
        - "❓ I have a question"
      default: 0
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: "In one sentence, what do you need?"
      placeholder: "e.g. Add a download button to the monthly sales report"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "How soon does this need attention?"
      options:
        - "🔴 P0 — Critical: something important is stopped"
        - "🟠 P1 — High: needed this sprint"
        - "🟡 P2 — Medium: in the next few weeks"
        - "🟢 P3 — Low: whenever there's time"
      default: 2
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: "Areas affected"
      description: "Pick every area this touches. Not sure? Pick the last option."
      multiple: true
      options:
        - "🌐 Web app"
        - "📱 Mobile app"
        - "🔐 Login & accounts"
        - "💳 Billing & payments"
        - "📊 Reports & analytics"
        - "📧 Emails & notifications"
        - "📄 Help pages & docs"
        - "🤷 Not sure"
    validations:
      required: true

  - type: dropdown
    id: who
    attributes:
      label: "Who is affected?"
      options:
        - "Just me"
        - "My team"
        - "One customer"
        - "Many customers"
        - "Everyone"
      default: 0

  - type: textarea
    id: details
    attributes:
      label: "Tell us more (optional)"
      description: "Why would this help? What happens today? Drag screenshots or files straight into this box."
      placeholder: "When I click Download on the Reports page, nothing happens…"

  - type: input
    id: deadline
    attributes:
      label: "Is there a deadline? (optional)"
      placeholder: "e.g. Before the client demo on 15 November"

  - type: checkboxes
    id: extras
    attributes:
      label: "Anything else?"
      options:
        - label: "I'm happy to answer follow-up questions or test the result"
        - label: "This came from a customer"
