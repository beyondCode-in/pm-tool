name: Move tickets with pull requests

# Pull request opened      → linked issues move to Code Review
# Pull request approved    → QA & Testing
# Pull request merged      → Done (GitHub closes "Fixes #N" issues itself)
# Link issues in the PR description with "Fixes #12", "Closes #12" or "Refs #12".

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  move:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update linked issues on the board
        if: env.PROJECT_TOKEN != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PROJECT_TOKEN }}
          script: |
            const { loadProject, addItem, setFields, linkedIssues } = require('./.github/scripts/project-sync.cjs');
            const pr = context.payload.pull_request;
            const { eventName, payload } = context;

            let status = null;
            if (eventName === 'pull_request_review') {
              if (payload.review.state === 'approved') status = 'QA';
            } else if (payload.action === 'closed') {
              if (pr.merged) status = 'Done';
            } else {
              status = 'Code';
            }
            if (!status) return core.info('Nothing to move for this event.');

            const issues = linkedIssues(pr.body);
            if (!issues.length) return core.info('No linked issues in the PR description.');

            const project = await loadProject(github.graphql);
            for (const number of issues) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });
              if (issue.pull_request) continue;
              const itemId = await addItem(github.graphql, project.id, issue.node_id);
              await setFields(github.graphql, project, itemId, { Status: status }, (m) => core.info(`#${number}: ${m}`));
            }
