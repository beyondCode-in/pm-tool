name: Publish web app

# Builds web/ as a static site and publishes it to GitHub Pages at
# https://<owner>.github.io/<repo>/. Configure under Settings → Secrets and
# variables → Actions → Variables (all optional except for GitHub sign-in):
#   OAUTH_CLIENT_ID   GitHub OAuth app client ID
#   AUTH_WORKER_URL   URL of the deployed web/worker sign-in Worker
#   PROJECT_NUMBER    project board number (default 34)
#   PIN_BOARD         "true" locks the site to this repo's board (a company's
#                     own copy); leave unset to let people pick any board
#                     after signing in (the shared site)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
          NEXT_PUBLIC_PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '34' }}
          NEXT_PUBLIC_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_AUTH_WORKER_URL: ${{ vars.AUTH_WORKER_URL }}
          NEXT_PUBLIC_ALLOWED_ORGS: ${{ vars.ALLOWED_ORGS }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ vars.GITHUB_APP_SLUG }}
          NEXT_PUBLIC_PIN_BOARD: ${{ vars.PIN_BOARD }}
      # Static hosts need a real file for unknown paths; Next exports 404.html.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
